<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 136 136" width="64" height="64" shape-rendering="geometricPrecision">
  <defs>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .cat-heart-main {
          transform-origin: 114px 26px;
          animation: 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite loafHeartFloatMain;
          will-change: transform, opacity;
        }
        .cat-heart-trail {
          transform-origin: 114px 26px;
          animation: 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite loafHeartFloatTrail;
          will-change: transform, opacity;
        }
      }
      @keyframes loafHeartFloatMain {
        0% {
          transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
          opacity: 0.95;
        }
        22% {
          transform: translate3d(0.5px, -2px, 0) scale(1.12) rotate(3deg);
          opacity: 1;
        }
        48% {
          transform: translate3d(3px, -15px, 0) scale(1.22) rotate(9deg);
          opacity: 0.88;
        }
        68% {
          transform: translate3d(5.5px, -26px, 0) scale(1.18) rotate(15deg);
          opacity: 0;
        }
        69% {
          transform: translate3d(-1px, 2px, 0) scale(0.65) rotate(-4deg);
          opacity: 0;
        }
        84% {
          transform: translate3d(0, 0.5px, 0) scale(0.92) rotate(-1deg);
          opacity: 0.65;
        }
        94% {
          transform: translate3d(0, -0.5px, 0) scale(1.02) rotate(1deg);
          opacity: 0.95;
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
          opacity: 0.95;
        }
      }
      @keyframes loafHeartFloatTrail {
        0%, 28% {
          transform: translate3d(-2px, 3px, 0) scale(0.5) rotate(-6deg);
          opacity: 0;
        }
        42% {
          transform: translate3d(-0.5px, -5px, 0) scale(0.78) rotate(-2deg);
          opacity: 0.9;
        }
        64% {
          transform: translate3d(2.5px, -16px, 0) scale(0.88) rotate(5deg);
          opacity: 0.75;
        }
        80% {
          transform: translate3d(5px, -25px, 0) scale(0.92) rotate(11deg);
          opacity: 0;
        }
        80.1%, 100% {
          transform: translate3d(-2px, 3px, 0) scale(0.5) rotate(-6deg);
          opacity: 0;
        }
      }
    </style>
  </defs>
