name: Deploy GitHub Pages

on:
  push:
    branches: [main, benji-style-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Astro types
        run: npx astro sync
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static site
        run: npm run build
      - name: Verify tokens & static output
        run: npx playwright test tests/tokens.spec.ts
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
